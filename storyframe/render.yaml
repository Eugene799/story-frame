services:
  - type: web
    name: storyframe
    runtime: node
    # A free instance sleeps, and the media, image, video, and lip sync sweeps
    # only run while this process is alive. `starter` is 512 MB; the three caps at
    # the bottom of envVars are the measured values that keep one copy inside it
    # (see "Instance size" in the README). Raise them only on a 1 GB instance.
    plan: starter
    # NODE_ENV below is visible to the build too, so npm ci would skip
    # devDependencies and `npm run check` would fail without its type packages.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # After CI Checks Pass. A Blueprint applies this and service creation
    # accepts it; changing the trigger on an existing service is dashboard-only
    # (Settings -> Build & Deploy -> Auto-Deploy).
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Build-time only: `npm run build` inlines these into the browser bundle.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: JSON2VIDEO_API_KEY
        sync: false
      - key: EVERYPIXEL_CLIENT_ID
        sync: false
      - key: EVERYPIXEL_SECRET_ID
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
      - key: LEONARDO_API_KEY
        sync: false
      # Measured caps for a 512 MB instance: the defaults (256 MiB render, 25 MiB
      # lip sync input, 256 MiB lip sync output) peak above the instance's total
      # memory. Peaks at these values: 311 MiB, 327 MiB, and 343 MiB.
      - key: VIDEO_MAX_BYTES
        value: "67108864"
      - key: LIPSYNC_MAX_INPUT_BYTES
        value: "16777216"
      - key: LIPSYNC_MAX_OUTPUT_BYTES
        value: "67108864"
